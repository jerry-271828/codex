name: Build codex for HarmonyOS PC (aarch64 musl, static-PIE)

# 为鸿蒙 PC（OpenHarmony / HarmonyOS PC，arm64_ohos）构建 codex CLI。
#
# 方案：musl 编译 + OHOS musl 链接（混合）
#   * 编译阶段用 aarch64-unknown-linux-musl：openai 官方 CI 自产 musl 版
#     librusty_v8（rusty-v8-v<ver> release），aws-lc 等 C 依赖用 zig 交叉编译。
#   * 链接阶段换 OHOS SDK 的 clang + OHOS sysroot：
#       - vanilla musl 的启动代码在 HongMeng 内核上崩（实测 __init_libc
#         解析初始栈 SIGSEGV）；OHOS musl 是华为适配版。链接器包装脚本
#         过滤 rustc 传入的 rust 自带（vanilla musl）crt 对象 / -nostartfiles /
#         self-contained 库路径，让 OHOS clang 驱动注入 OHOS 的
#         rcrt1.o/crti.o/libc.a。
#       - OHOS lld 的 -Wl,--code-sign 在链接期直接嵌入 .codesign 签名，
#         产物落地即可执行（无需设备端 binary-sign-tool 补签）。
#       - SDK 必须 ≥7.0-Beta1：6.1 的 --code-sign 对 >512KB 签名数据算错
#         Merkle 根哈希；verify-codesign.py 步骤兜底拦截。
#   * -static-pie：鸿蒙内核只放行 PIE（ET_DYN），全静态则免除 OHOS 动态
#     loader 与 SDK/设备 libc 版本偏差问题。
#
# OHOS SDK 从 jerry-271828/iperf 的 ci-toolchain-7.0-Beta1 release 镜像拉取
# （GitHub 内网秒下；直连华为云 CDN 可能 1 小时+）。
#
# 产物已签名：下载 artifact 后 chmod +x 直接运行。

on:
  workflow_dispatch:
  push:
    branches: [ohos-build]

permissions:
  contents: read

env:
  TARGET: aarch64-unknown-linux-musl
  OHOS_SDK_RELEASE: 7.0-Beta1
  OHOS_NATIVE_ZIP: native-linux-x64-26.0.0.25-Beta.zip
  OHOS_NATIVE_SHA256: bf5000a934746794842baff28d01bc0ad59cb89a92c74f0346b70c9a65d58ab8
  OHOS_SDK_MIRROR: https://github.com/jerry-271828/iperf/releases/download/ci-toolchain-7.0-Beta1

jobs:
  build:
    # 必须 x64：OHOS SDK 只发布 linux-x64 宿主的 llvm 工具链（lld 要在
    # 宿主上跑）。C 依赖交叉编译由 zig 完成，与宿主架构无关。
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # cargo 缓存(全量 workspace target,数十 GB)+ OHOS SDK 展开会挤爆
      # 标准 runner 的磁盘(实测 "No space left on device" 死在缓存恢复)。
      # 清掉预装的无关大件,可腾 ~25GB。
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Print runner specs
        run: |
          set -euo pipefail
          echo "OS: $(uname -a)"
          echo "Logical CPUs: $(nproc)"
          awk '/MemTotal/ {printf "Total RAM: %.1f GiB\n", $2/1024/1024}' /proc/meminfo
          df -h .

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ohos-cargo-v3-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ohos-cargo-v3-
            ohos-cargo-

      # zig 为 install-musl-build-tools.sh 提供 clang 系 C/C++ 交叉编译器；
      # 缺了它脚本退回 gcc 且带 clang 专用 flag，aws-lc 汇编全炸（第 1 轮教训）。
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      # SDK 提前到 shim 之前下载：libcap 的 shim 要用 OHOS clang（见下步）。
      - name: Restore OHOS native toolchain cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ohos-native
          key: ohos-native-linux-x64-${{ env.OHOS_SDK_RELEASE }}

      - name: Download OHOS native toolchain (GitHub mirror)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/native-linux.zip" \
            "${OHOS_SDK_MIRROR}/${OHOS_NATIVE_ZIP}"
          echo "${OHOS_NATIVE_SHA256}  $RUNNER_TEMP/native-linux.zip" | sha256sum -c -
          mkdir -p ~/ohos-native
          unzip -q "$RUNNER_TEMP/native-linux.zip" -d ~/ohos-native
          rm -f "$RUNNER_TEMP/native-linux.zip"

      # x64 宿主上没有 aarch64 musl gcc；伪造一个同名命令给上游脚本编 libcap.a。
      # 用 OHOS clang 而非 zig：libcap 最终链进 OHOS libc，用 OHOS 编译器
      # +sysroot 最一致。emutls 更正：此前判定"OHOS compiler-rt 没有
      # __emutls_get_address"是 grep ' T ' 的假阴性——它在 SDK 的
      # libclang_rt.builtins.a 里是弱符号 'W'（已在真机 SDK 复核，且
      # OHOS libc.a 自己的 cxa_thread_atexit_impl.o 就带 emutls 引用，谁都
      # 绕不开）。现在由链接器包装脚本统一附加 SDK builtins.a 兜底解析一切
      # emulated-TLS 引用，见 "Set up OHOS linker" 步骤。
      # （codex 主程序的其余 C 依赖没有 TLS，继续用 zigcc 编不受影响。）
      - name: Provide aarch64-linux-musl-gcc shim (OHOS clang)
        run: |
          set -euo pipefail
          NATIVE="$HOME/ohos-native/native"
          test -x "$NATIVE/llvm/bin/clang"
          sudo tee /usr/local/bin/aarch64-linux-musl-gcc >/dev/null <<EOF
          #!/usr/bin/env bash
          exec "$NATIVE/llvm/bin/clang" --target=aarch64-linux-ohos --sysroot="$NATIVE/sysroot" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/aarch64-linux-musl-gcc
          aarch64-linux-musl-gcc --version | head -1

      # 上游脚本：zigcc/zigcxx 交叉编译 aws-lc / boringssl 等原生依赖到 musl，
      # 构建 libcap.a，写入 CC_/CXX_/CARGO_TARGET_*_LINKER 等到 $GITHUB_ENV。
      # 该脚本本为 arm64 runner 写的（宿主==目标），在 x64 上交叉编 libcap 有两个坑，
      # 用 sed 预 patch 脚本内的 libcap make 命令行修复（命令行赋值优先级最高，
      # 必定生效，不受 Make 的 ?= / 环境变量优先级影响）：
      #   1. BUILD_CC=cc：_makenames 是构建期工具，必须宿主(x64) cc 编，
      #      否则被 aarch64 shim 编成 arm64 → "Exec format error"。
      #   2. SHARED=no：脚本只取 libcap.a，但 make 默认 all 还会造 libcap.so，
      #      其中 objcopy --dump-section 处理 aarch64 ELF 在宿主 objcopy 上炸
      #      （"Unable to recognise the format"）。只建静态库即可。
      - name: Install musl build tools (zig cross toolchain)
        run: |
          set -euo pipefail
          sed -i 's|make -C "${libcap_source_dir}/libcap" -j"$(nproc)" \\|make -C "${libcap_source_dir}/libcap" -j"$(nproc)" BUILD_CC=cc SHARED=no \\|' \
            "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          # 确认 patch 生效
          grep -n 'BUILD_CC=cc SHARED=no' "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      # 关键 host/target 隔离：上游脚本给 $GITHUB_ENV 写了全局无后缀
      # CC/CXX/CFLAGS/CXXFLAGS/CMAKE_*（都面向 aarch64 zigcc）。它本为 arm64
      # runner 写（host==target），在 x64 host 上有两处污染 host 编译：
      #   1. 全局 CC=zigcc → cargo 为 host 编 build-script 的 C 代码（host 版
      #      ring/sqlite3 汇编）时 cc-rs 回退到它，用 aarch64 编译器产出 aarch64
      #      对象 → 链进 x64 proc-macro "incompatible with elf64-x86-64"。
      #   2. 全局 CFLAGS 含 clang 专用 -Wno-error=frame-larger-than → host gcc
      #      不认（gcc 要带等号）→ host ring 每个 .c 编译失败。
      # 修法：全局 CC/CXX/CFLAGS/CXXFLAGS/CMAKE_* 全部重置为 host 干净值；
      # aarch64 目标编译改由 target-suffixed 变量承载：
      #   CC_aarch64_unknown_linux_musl（上游已写）+ 这里补写的
      #   CFLAGS_aarch64_unknown_linux_musl（把 aws-lc/boringssl 在 clang 下需要
      #   的 -pthread -Wno-error=frame-larger-than 只给 target）。
      #   （注：libcap 的 emulated-TLS 问题不在这里解决——libcap 由上游脚本的
      #   make 构建，不读这些变量；已通过把 aarch64-linux-musl-gcc shim 换成
      #   OHOS clang（native TLS）从源头解决，见 "Provide ... shim" 步骤。）
      #   cc-rs 变量优先级：<VAR>_<target> > TARGET_<VAR> > <VAR>，故 target
      #   编译用 zigcc + 上述 CFLAGS，host 编译用干净的 cc + 空 CFLAGS，互不干扰。
      - name: Isolate host/target C compiler env
        run: |
          set -euo pipefail
          {
            echo "CC=cc"
            echo "CXX=c++"
            echo "CFLAGS="
            echo "CXXFLAGS="
            echo "CMAKE_C_COMPILER=cc"
            echo "CMAKE_CXX_COMPILER=c++"
            echo "CFLAGS_aarch64_unknown_linux_musl=-pthread -Wno-error=frame-larger-than"
            echo "CXXFLAGS_aarch64_unknown_linux_musl=-pthread -Wno-error=frame-larger-than"
          } >> "$GITHUB_ENV"

      # 见上游 rust-release.yml：musl 上 aws-lc 的 jitter entropy 路径有问题，关掉。
      - name: Disable aws-lc jitter entropy (musl)
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY_aarch64_unknown_linux_musl=1" >> "$GITHUB_ENV"

      # 最终链接器：OHOS clang + OHOS musl sysroot。包装脚本过滤 rustc 为 musl
      # 目标默认传入、与我们 -static-pie + OHOS libc 冲突的参数：
      #   - -static 和 -no-pie：rustc 因 crt-static 默认想产 ET_EXEC，与
      #     -static-pie 冲突（clang: "cannot specify 'nopie' along with
      #     'static-pie'"）。全部丢弃，只留我们的 -static-pie。
      #   - -nostartfiles：rustc 用它压制驱动默认 crt 以塞自带 vanilla musl crt；
      #     我们要让 OHOS clang 驱动注入 OHOS 的 crt，故丢弃。
      #   - */self-contained/*.o：rust 自带 vanilla musl 的 crt1/crti/crtbegin/
      #     crtend/crtn 等对象，全部丢弃（含 crtbegin/crtend，不只 crt1/crti）。
      #   - -L */self-contained*：防止 -lc/-lunwind 解析到 rust 的 vanilla musl。
      # 并在链接末尾无条件附加 SDK 的 libclang_rt.builtins.a：OHOS 静态 libc.a
      # 的 cxa_thread_atexit_impl.o（华为线程 dtor 改造）以 emulated-TLS 编译，
      # 引用 __emutls_get_address；纯 Rust 的 codex 不受影响（Rust std 对
      # __cxa_thread_atexit_impl 是弱引用，不触发该归档成员抽取），但 bwrap
      # 链接 libcap/standalone_bwrap 等 C 归档时会拉进来。该符号在 builtins.a
      # 里是弱符号 'W'（真机 SDK 实测；上轮 grep ' T ' 是假阴性）。lld 对归档
      # 全局惰性解析：只有未决引用才抽取成员，且与 rust 自带 compiler_builtins
      # 不冲突（已定义符号不再抽取），纯 Rust 链接零开销。
      # 探测 lld 支持 --code-sign 再放行。
      - name: Set up OHOS linker (overrides musl gcc)
        run: |
          set -euxo pipefail
          NATIVE="$HOME/ohos-native/native"
          test -x "$NATIVE/llvm/bin/clang"
          test -d "$NATIVE/sysroot"
          if ! "$NATIVE/llvm/bin/ld.lld" --help | grep -- '--code-sign' >/dev/null; then
            echo "This SDK's lld lacks --code-sign; use >= 7.0-Beta1" >&2; exit 1
          fi
          RTLIB="$(find "$NATIVE/llvm/lib/clang" -path '*aarch64-linux-ohos*' -name 'libclang_rt.builtins.a' | head -1)"
          test -f "$RTLIB"
          # 弱符号是 'W' 不是 'T'；用 if ! ... >/dev/null 而非 grep -q，避免
          # pipefail 下 grep -q 提前退出触发上游 SIGPIPE 的假失败。
          if ! "$NATIVE/llvm/bin/llvm-nm" "$RTLIB" | grep -E '[TW] __emutls_get_address' >/dev/null; then
            echo "builtins archive lacks __emutls_get_address: $RTLIB" >&2; exit 1
          fi
          wrapper="$RUNNER_TEMP/ohos-link-clang"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          drop_next=0
          for a in "\$@"; do
            if [[ "\$drop_next" -eq 1 ]]; then
              drop_next=0
              case "\$a" in
                */self-contained*) continue ;;   # -L <dir> 指向 self-contained：连值丢弃
                *) args+=("-L" "\$a"); continue ;;
              esac
            fi
            case "\$a" in
              -static|-no-pie|-nopie|-nostartfiles) continue ;;
              */self-contained/*.o) continue ;;   # 所有 rust 自带 vanilla musl crt 对象
              -L)
                drop_next=1; continue ;;           # -L <dir> 两参形式：暂存，下一轮判定
              -L*/self-contained*) continue ;;     # -L<dir> 单参形式
            esac
            args+=("\$a")
          done
          exec "$NATIVE/llvm/bin/clang" --target=aarch64-linux-ohos --sysroot="$NATIVE/sysroot" "\${args[@]}" "$RTLIB"
          EOF
          chmod +x "$wrapper"
          # 冒烟 1：包装器能把最小 C 程序链成 static-pie + 签名（模拟 rustc 会传的
          # 冲突参数 -static -no-pie，确认被正确过滤）。
          echo 'int main(){return 0;}' > "$RUNNER_TEMP/t.c"
          "$wrapper" "$RUNNER_TEMP/t.c" -static -no-pie -static-pie -Wl,--code-sign -o "$RUNNER_TEMP/t.out"
          "$NATIVE/llvm/bin/llvm-readelf" -h "$RUNNER_TEMP/t.out" | grep -E 'Type:.*DYN'
          "$NATIVE/llvm/bin/llvm-readelf" -S "$RUNNER_TEMP/t.out" | grep codesign
          # 冒烟 2：emulated-TLS 引用（等价于 OHOS libc.a cxa_thread_atexit_impl.o
          # 的场景）能被附加的 builtins.a 解析。真机同构验证已通过：该产物在
          # 鸿蒙内核上实际运行返回 0。
          printf '_Thread_local int x = 42;\nint main(void){return x-42;}\n' > "$RUNNER_TEMP/ttls.c"
          "$NATIVE/llvm/bin/clang" --target=aarch64-linux-ohos --sysroot="$NATIVE/sysroot" \
            -femulated-tls -c "$RUNNER_TEMP/ttls.c" -o "$RUNNER_TEMP/ttls.o"
          if ! "$NATIVE/llvm/bin/llvm-nm" "$RUNNER_TEMP/ttls.o" | grep 'U __emutls_get_address' >/dev/null; then
            echo "smoke object lacks expected emutls reference" >&2; exit 1
          fi
          "$wrapper" "$RUNNER_TEMP/ttls.o" -static -no-pie -static-pie -Wl,--code-sign -o "$RUNNER_TEMP/ttls.out"
          "$NATIVE/llvm/bin/llvm-readelf" -h "$RUNNER_TEMP/ttls.out" | grep -E 'Type:.*DYN'
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$wrapper" >> "$GITHUB_ENV"
          echo "OHOS_NATIVE=$NATIVE" >> "$GITHUB_ENV"

      # 上游 composite action：从 openai/codex 的 rusty-v8-v<ver> release 下载
      # musl 版 librusty_v8 + src_binding，校验 sha256，导出 RUSTY_V8_* 环境变量。
      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-unknown-linux-musl

      # RUSTFLAGS 说明（必须用 CARGO_TARGET_<triple>_RUSTFLAGS 而非全局
      # RUSTFLAGS：proc-macro / build-script 为构建宿主 x64 编译并在编译期运行，
      # 全局 RUSTFLAGS 会把 -static-pie/--code-sign/OHOS 链接器也加到宿主编译上，
      # 导致 x64 的 proc-macro 去链接 aarch64 标志 → incompatible with
      # elf64-x86-64。target-specific 变量只作用于 aarch64 目标 crate）：
      #   crt-static + relocation-model=pic + -static-pie → 全静态 PIE(ET_DYN)
      #   -Wl,--code-sign → 链接期嵌入 .codesign（鸿蒙内核 execve 强制校验）
      #   -Wl,--strip-debug → 链接期去 debug 段（链接后 strip 会毁签名，
      #     必须在链接参数里做；否则产物 1.3GB）
      #   -Wl,--error-limit=0 → 失败时打全错误便于迭代
      # 完整发布版含 4 个二进制：codex（主）、codex-code-mode-host（code-mode/v8
      # 运行时子进程）、codex-responses-api-proxy、bwrap（沙箱助手）。构建顺序
      # 关键：bwrap 必须先构建并定稿（含链接期签名+strip，因签名字节计入摘要），
      # 算出 sha256 注入 CODEX_BWRAP_SHA256，再编 codex——codex 用 option_env!
      # 在编译期嵌入该摘要，运行时校验 codex-resources/bwrap 的完整性。
      - name: Build bwrap first and export its digest
        working-directory: codex-rs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=pic -C link-arg=-static-pie -C link-arg=-Wl,--code-sign -C link-arg=-Wl,--strip-debug -C link-arg=-Wl,--error-limit=0"
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          BW="target/${TARGET}/release/bwrap"
          test -f "$BW"
          # bwrap 已是链接期 strip+签名的最终字节，直接对其算摘要（不能再 strip，
          # 否则毁签名且改变字节使摘要与打包内容不符）。它链接的 libcap.a 由
          # OHOS clang shim 编译（native TLS），不存在 emutls 符号问题；libcap
          # 在 RUNNER_TEMP 下每轮重建，不受 cargo 缓存影响。
          digest="$(sha256sum "$BW" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "bwrap sha256 = ${digest}"

      # 用上一步的 CODEX_BWRAP_SHA256 编其余 3 个 bin。code-mode-host 依赖 v8，
      # 与 codex 一样是重编译；proxy 轻量。一次 cargo build 三个 --bin。
      - name: Build codex + host + proxy (embedding bwrap digest)
        working-directory: codex-rs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=pic -C link-arg=-static-pie -C link-arg=-Wl,--code-sign -C link-arg=-Wl,--strip-debug -C link-arg=-Wl,--error-limit=0"
        run: |
          set -euo pipefail
          test -n "${CODEX_BWRAP_SHA256:-}"   # 必须已由上一步注入
          cargo build --target "$TARGET" --release \
            --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy

      - name: Verify all binaries are aarch64 static PIE with valid codesign
        working-directory: codex-rs
        run: |
          set -euo pipefail
          READELF="$OHOS_NATIVE/llvm/bin/llvm-readelf"
          curl -fsSL -o /tmp/verify-codesign.py \
            https://raw.githubusercontent.com/jerry-271828/iperf/master/scripts/verify-codesign.py
          for b in codex codex-code-mode-host codex-responses-api-proxy bwrap; do
            BIN="target/${TARGET}/release/${b}"
            test -f "$BIN" || { echo "missing binary: $b"; exit 1; }
            echo "=== $b ==="
            file "$BIN" || true
            "$READELF" -h "$BIN" | grep -q "DYN" \
              || { echo "$b is not PIE (ET_DYN required by HarmonyOS PC)"; exit 1; }
            if "$READELF" -l "$BIN" | grep -q INTERP; then
              echo "$b has INTERP segment; not statically linked"; exit 1
            fi
            "$READELF" -S "$BIN" | grep -q codesign \
              || { echo "$b has no .codesign section"; exit 1; }
            vout="$(python3 /tmp/verify-codesign.py "$BIN")"
            echo "$vout"
            case "$vout" in
              *"MATCH: True"*) : ;;
              *) echo "$b code signature root hash is INVALID"; exit 1 ;;
            esac
            echo "OK: $b aarch64 static-PIE, no INTERP, .codesign MATCH"
          done

      # 按上游发布布局打包：codex 与 codex-code-mode-host 平级，bwrap 放
      # codex-resources/（codex 运行时在 <exe_dir>/codex-resources/bwrap 找它）。
      # codex-responses-api-proxy 作为独立二进制随包提供。
      - name: Stage full release bundle
        run: |
          set -euo pipefail
          R="codex-rs/target/${TARGET}/release"
          B="dist/codex-ohos-aarch64"
          rm -rf dist && mkdir -p "$B/codex-resources"
          cp "$R/codex"                       "$B/codex"
          cp "$R/codex-code-mode-host"        "$B/codex-code-mode-host"
          cp "$R/codex-responses-api-proxy"   "$B/codex-responses-api-proxy"
          cp "$R/bwrap"                       "$B/codex-resources/bwrap"
          chmod 0755 "$B/codex" "$B/codex-code-mode-host" \
                     "$B/codex-responses-api-proxy" "$B/codex-resources/bwrap"
          ( cd "$B" && sha256sum codex codex-code-mode-host \
              codex-responses-api-proxy codex-resources/bwrap > SHA256SUMS )
          echo "CODEX_BWRAP_SHA256 embedded = ${CODEX_BWRAP_SHA256}"
          cat "$B/SHA256SUMS"
          # 打一个可复现 tar 供整体分发
          tar -C "$B" --sort=name --mtime='1970-01-01 00:00:00 UTC' \
              --owner=0 --group=0 --numeric-owner \
              -cf - codex codex-code-mode-host codex-responses-api-proxy codex-resources/bwrap \
            | zstd -T0 -19 -o "dist/codex-ohos-aarch64-bundle.tar.zst"
          ls -la "$B" "$B/codex-resources" dist

      - name: Write device instructions to summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 完整发布版（鸿蒙 PC，aarch64 static-PIE，链接期已签名）

          artifact `codex-ohos-aarch64` 解压得到：
          ```
          codex                         # 主程序
          codex-code-mode-host          # code-mode/v8 运行时子进程
          codex-responses-api-proxy     # responses API 代理
          codex-resources/bwrap         # 沙箱助手（codex 按摘要校验）
          ```
          安装（保持 codex 与 codex-resources/ 的相对布局）：
          ```sh
          chmod +x codex codex-code-mode-host codex-responses-api-proxy codex-resources/bwrap
          ./codex --version
          ```
          若内核拒绝执行（EPERM）：`binary-sign-tool sign -inFile <bin> -outFile <bin> -selfSign 1`
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: codex-ohos-aarch64
          path: dist/
          if-no-files-found: error
